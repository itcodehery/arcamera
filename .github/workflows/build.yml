name: 'Build and Release'

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.platform }}
    
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install frontend dependencies
        run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: Setup FFmpeg Sidecar (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path src-tauri/bin
          $ffmpeg = (Get-Command ffmpeg -ErrorAction SilentlyContinue).Source
          if ($ffmpeg) {
            Copy-Item $ffmpeg src-tauri/bin/ffmpeg-x86_64-pc-windows-msvc.exe
          } else {
            Invoke-WebRequest -Uri "https://github.com/GyanD/codexffmpeg/releases/download/7.1/ffmpeg-7.1-essentials_build.zip" -OutFile ffmpeg.zip
            Expand-Archive ffmpeg.zip -DestinationPath .
            Copy-Item (Get-ChildItem -Path "ffmpeg-*" -Filter "ffmpeg.exe" -Recurse).FullName src-tauri/bin/ffmpeg-x86_64-pc-windows-msvc.exe
          }

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: 'Arcamera v__VERSION__'
          releaseBody: 'Release v__VERSION__'
          releaseDraft: true
          prerelease: false
